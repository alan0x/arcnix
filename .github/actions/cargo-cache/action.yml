name: Cargo cache
description: Cache normal Cargo registry and workspace build directories.
runs:
  using: composite
  steps:
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry/index/index.crates.io-*
          ~/.cargo/registry/cache/index.crates.io-*
          ~/.cargo/registry/src/index.crates.io-*
          ~/.cargo/git
          target/debug
          target/release
        key: ${{ runner.os }}-${{ runner.arch }}-rust-1.100-v2-${{ hashFiles('Cargo.lock') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-rust-1.100-v2-
