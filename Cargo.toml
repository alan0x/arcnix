[workspace]
members = ["crates/arcnix-core", "crates/arcnix"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/arcnix-org/arcnix"
homepage = "https://arcnix.org"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arcnix-core = { version = "0.3.0", path = "crates/arcnix-core" }

# glory-wry 0.7.0 pins wry 0.57.1. Keep the parent resize handler when a child closes.
[patch.crates-io]
wry = { git = "https://github.com/tauri-apps/wry", rev = "5006b49b3a643b5544263ff9863b797a810d549b" }
