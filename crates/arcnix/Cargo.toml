[package]
name = "arcnix"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A friendly desktop workspace for managing servers over SSH"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ssh", "sftp", "desktop", "server", "terminal"]
categories = ["gui", "network-programming"]

[[bin]]
name = "arcnix"
path = "src/main.rs"

[dependencies]
flate2 = "1"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
arcnix-core.workspace = true
glory = { version = "=0.7.0", features = ["wry"] }
sapid = "=0.7.1"
async-channel = "2"

wry = "=0.57.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8.9"
directories = "6"
tempfile = "3"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
webview2-com = "=0.39.1"
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }
